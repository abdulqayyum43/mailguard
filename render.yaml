services:
  - type: web
    name: mailguard
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_SECRET
        generateValue: true
      - key: SCAN_TIMEOUT
        value: "20.0"
      - key: DNS_TIMEOUT
        value: "5.0"
      - key: SMTP_CONNECT_TIMEOUT
        value: "5.0"
      - key: DATA_DIR
        value: data
      - key: TOYYIBPAY_SECRET_KEY
        sync: false
      - key: TOYYIBPAY_CATEGORY_CODE
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: INITIAL_API_KEYS
        sync: false
